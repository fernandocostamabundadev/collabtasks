services:
  db:
    image: postgres:16-alpine
    container_name: collabtasks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: collabtasks
      POSTGRES_USER: collabtasks
      POSTGRES_PASSWORD: collabtasks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabtasks -d collabtasks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
